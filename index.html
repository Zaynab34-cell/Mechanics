<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanics Mastery — Mechanical Engineering Thinking Trainer</title>
<meta name="description" content="Interactive learning platform for mechanics of rigid bodies, deformable bodies and fluid mechanics.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Cpath d='M6 22h20M16 10v12M9 10l14 12M23 10L9 22' stroke='%2338bdf8' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<div class="app">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 40 40" class="brand-mark" aria-hidden="true">
        <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3"/>
        <circle cx="20" cy="20" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <circle cx="20" cy="20" r="2.4" fill="currentColor"/>
        <path d="M20 4v5M20 31v5M4 20h5M31 20h5" stroke="currentColor" stroke-width="2"/>
      </svg>
      <div class="brand-text">
        <strong>MECHANICS</strong>
        <span>MASTERY</span>
      </div>
    </div>

    <div class="mastery-chip" id="sidebar-mastery">
      <div class="mastery-ring"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"/><circle class="ring-fg" id="ring-fg" cx="18" cy="18" r="15.5"/></svg><span id="mastery-pct">0%</span></div>
      <div class="mastery-label"><b>Overall Mastery</b><small id="mastery-sub">no data yet</small></div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="streak" id="streak-box" title="Practice streak">
        <span class="streak-num" id="streak-num">0</span><span>day streak</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="btn-reset">Reset progress</button>
    </div>
  </aside>

  <!-- ══════════ MAIN ══════════ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="btn-menu" aria-label="Menu">☰</button>
      <div class="crumbs" id="crumbs"><span>Mechanics Mastery</span></div>
      <div class="topbar-right">
        <div class="due-chip" id="due-chip" title="Concepts due for spaced review">
          <span class="dot"></span><b id="due-count">0</b> due for review
        </div>
        <div class="xp-chip" id="xp-chip" title="Experience points">XP <b id="xp-count">0</b></div>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script src="js/util.js?v=6"></script>
<script src="js/data/formulas.js?v=6"></script>
<script src="js/data/topics.js?v=6"></script>
<script src="js/data/questions.js?v=6"></script>
<script src="js/data/cases.js?v=6"></script>
<script src="js/state.js?v=6"></script>
<script src="js/sims.js?v=6"></script>
<script src="js/views/question.js?v=6"></script>
<script src="js/views/dashboard.js?v=6"></script>
<script src="js/views/map.js?v=6"></script>
<script src="js/views/learn.js?v=6"></script>
<script src="js/views/lab.js?v=6"></script>
<script src="js/views/practice.js?v=6"></script>
<script src="js/views/quiz.js?v=6"></script>
<script src="js/views/mistakes.js?v=6"></script>
<script src="js/views/formulas.js?v=6"></script>
<script src="js/views/cases.js?v=6"></script>
<script src="js/views/progress.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
